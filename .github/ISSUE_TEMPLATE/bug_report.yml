name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach copyrighted song files. Use the CC0 demo when possible.
  - type: input
    id: version
    attributes:
      label: Musirail version
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and operating system
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
